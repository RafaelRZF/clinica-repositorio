<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClínicaMed - Escolha seu perfil</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #eef3f8; color: #1c2b36;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 12px; }
        h1 { margin: 0 0 4px; font-size: 1.6rem; color: #0b6fa4; text-align: center; }
        .sub { margin: 0 0 24px; color: #5b6b78; text-align: center; }
        a { color: #0b6fa4; }
        main { width: 100%; max-width: 820px; }
        .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 14px; padding: 28px 20px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.10); }
        .icone { font-size: 3rem; line-height: 1; }
        .card h2 { margin: 12px 0 4px; color: #0b6fa4; }
        .card p { margin: 0 0 18px; color: #5b6b78; font-size: .9rem; min-height: 2.6em; }
        .btn { display: block; padding: 11px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 8px; }
        .entrar { background: #0b6fa4; color: #fff; }
        .entrar:hover { background: #095a86; }
        .criar { border: 1px solid #0b6fa4; color: #0b6fa4; }
        .criar:hover { background: #eaf4fa; }
    </style>
</head>
<body>
<main>
    <h1>ClínicaMed</h1>
    <p class="sub">Para criar sua conta, escolha o seu perfil:</p>
    <div class="grade">
        <section class="card">
            <div class="icone">🧑</div>
            <h2>Paciente</h2>
            <p>Marque consultas, veja prontuários e pagamentos.</p>
            <a class="btn entrar" href="/cadastro.html">Escolher</a>
        </section>
        <section class="card">
            <div class="icone">🩺</div>
            <h2>Médico</h2>
            <p>Acompanhe suas consultas e prontuários.</p>
            <a class="btn entrar" href="/cadastroMedico.html">Escolher</a>
        </section>
        <section class="card">
            <div class="icone">🗂️</div>
            <h2>Funcionário</h2>
            <p>Gerencie cadastros, consultas e pagamentos.</p>
            <a class="btn entrar" href="/cadastroFuncionario.html">Escolher</a>
        </section>
    </div>
    <p style="text-align:center;margin-top:22px"><a href="/index.html">&larr; Voltar para o login</a></p>
</main>
</body>
</html>
